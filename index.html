<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldly</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./worldly.js" defer ></script>
</head>
<body>
    <!-- MIGHT NEED A FORM ELEMENT -->
    <header>
        <h1 id="welcomeMessage">
            <span id="welcome">Welcome to </span>
            <span id="worldly">Worldly</span> 
            <span id="dictApp">Dictionary App</span>
        </h1>
    </header>

        <div id="wordsDiv">
            <section>
                <span class="favSpan">
                    <select class="favSelect" >
                        <option disabled selected>Favourite Words</option>
                        <optgroup label="Favourite Words">
                            <option id="favOptions"></option>
                    </optgroup>
                </select>               
                </span>
                </section>
            <section>      
            <span class="recentSpan">               
                    <select class="recentSelect" >
                        <option disabled selected>Recent Search</option>
                        <optgroup label="Recent Search">
                            <option id="recentOptions"></option>                     
                    </optgroup>
                </select>
            </span>
            </section>
            <section>
            <span class="wordsSpan">        
                    <select class="dailyWordSelect" >
                        <option disabled selected>Word Of The Day</option>
                        <optgroup label="Word Of The Day">
                            <option id="dailyWordOptions"></option>

                    </optgroup>
                </select>           
            </span>
            </section>
        </div>

    <main id="main">

        <div id="searchAndRetrieve">
            <input id="wordInput" type="text" placeholder="Shoot Your Word">
            <!-- ADD CLEAR BUTTON ICON -->

            <button id="searchBtn">Search</button>
            <!-- something about audio <search></search> -->
        </div>
        <div id="results">
            <!-- dynamically add text -->
        </div>
    </main>
    
</body>
</html>
